apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-stack
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
  values:
    fullnameOverride: metrics-stack
    grafana:
      enabled: false
    defaultRules:
      create: true
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    alertmanager:
      enabled: true
      alertmanagerSpec:
        nodeSelector:
          personal-stack/site: frankfurt
        storage:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi
    prometheus:
      service:
        type: ClusterIP
      prometheusSpec:
        nodeSelector:
          personal-stack/site: frankfurt
        retention: 15d
        # Required so Tempo's metrics-generator can remote-write
        # span/service-graph metrics into the same Prometheus.
        enableRemoteWriteReceiver: true
        # Store trace exemplars alongside each histogram bucket so the
        # API-latency dashboards can render a clickable traceID dot per
        # request. Grafana's Prometheus datasource already declares
        # exemplarTraceIdDestinations → tempo, so this is the missing
        # half of the pipeline. The feature flag is the upstream
        # `--enable-feature=exemplar-storage` Prometheus argument.
        enableExemplarStorage: true
        enableFeatures:
          - exemplar-storage
        # Adding ~30 ServiceMonitors + DCGM + Pyroscope-derived recording
        # rules + Tempo span-metrics roughly doubles cardinality vs
        # Phase 1, so bump from 20Gi to 50Gi to keep 15-day retention.
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi
    prometheusOperator:
      # The operator belongs with the Prometheus and Alertmanager it
      # manages rather than wherever the scheduler happens to place it.
      nodeSelector:
        personal-stack/site: frankfurt
      admissionWebhooks:
        patch:
          # The kube-webhook-certgen create/patch Jobs run as Helm
          # pre-upgrade hooks, so the whole upgrade fails if they do not
          # finish inside the release timeout. Unpinned, they landed on a
          # Raspberry Pi and spent longer than 5 minutes pulling
          # ghcr.io/jkroepke/kube-webhook-certgen over the home
          # connection, which failed the upgrade with
          # "pre-upgrade hooks failed: timeout waiting for:
          # [Job/observability/metrics-stack-admission-create]" and left
          # apps-observability — and everything depending on it —
          # unreconciled. Frankfurt pulls the image in seconds.
          nodeSelector:
            personal-stack/site: frankfurt
